site_name: cl-event-sourcing-kit
site_description: Domain-independent event sourcing protocol for Common Lisp
site_url: https://nerima-lisp.github.io/cl-event-sourcing-kit/
repo_url: https://github.com/nerima-lisp/cl-event-sourcing-kit
repo_name: nerima-lisp/cl-event-sourcing-kit
edit_uri: edit/main/docs/src/

docs_dir: src

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Core concepts: guide/core-concepts.md
      - Event store: guide/event-store.md
      - Replay and staging: guide/replay-and-staging.md
      - Projections: guide/projections.md
      - Durable runtime: guide/durable-runtime.md
      - Recipes: guide/recipes.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
      - Compatibility: reference/compatibility.md
  - Project:
      - Capability matrix: project/capability-matrix.md
      - Development: project/development.md
      - Scope: project/scope.md
      - Roadmap: project/roadmap.md
